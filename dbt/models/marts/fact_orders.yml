version: 2

models:

  - name: fact_orders

    description: >
      Order-level fact table containing order status, purchase and delivery
      timestamps, item counts, product sales, freight, total order value,
      and delivery performance metrics.
      Grain: one row per order_id.

    meta:

      joins:
        - join: dim_customers
          sql_on: ${fact_orders.customer_id} = ${dim_customers.customer_id}
          type: left
          relationship: many-to-one

      metrics:

        total_revenue:
          type: sum
          sql: ${total_order_value}

        total_orders:
          type: count_distinct
          sql: ${order_id}

        average_order_value:
          type: average
          sql: ${total_order_value}

        total_items:
          type: sum
          sql: ${item_count}

        total_product_sales:
          type: sum
          sql: ${total_price}

        total_freight:
          type: sum
          sql: ${total_freight_value}

        average_delivery_days:
          type: average
          sql: ${delivery_days}
          label: Average Delivery Days
          description: "Average number of days from order purchase to actual customer delivery."

        average_delivery_delay:
          type: average
          sql: ${delivery_delay_days}
          label: Average Delivery Delay
          description: "Average difference between actual and estimated delivery time."

        late_orders:
          type: sum
          sql: ${is_late}
          label: Late Orders
          description: "Number of orders delivered after the estimated delivery date."

        late_delivery_rate:
          type: number
          sql: |
            100.0 * SUM(${is_late}) / NULLIF(COUNT(${order_id}), 0)
          label: Late Delivery Rate
          description: "Percentage of orders delivered after the estimated delivery date."

    columns:

      - name: order_id
        description: "Unique identifier for the order. The model grain is one row per order."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier linking the order to the corresponding customer record in dim_customers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status
        description: "Current status of the order, such as delivered, canceled, or unavailable."

      - name: order_purchase_at
        description: "Timestamp when the customer placed the order."

      - name: order_approved_at
        description: "Timestamp when payment for the order was approved."

      - name: order_delivered_carrier_at
        description: "Timestamp when the order was handed over to the carrier."

      - name: order_delivered_customer_at
        description: "Timestamp when the order was delivered to the customer."

      - name: order_estimated_delivery_at
        description: "Estimated delivery date provided for the order."

      - name: item_count
        description: "Number of items included in the order."
        meta:
          dimension:
            type: number

      - name: total_price
        description: "Total product sales value for all items in the order, excluding freight."
        meta:
          dimension:
            type: number

      - name: total_freight_value
        description: "Total freight value associated with the items in the order."
        meta:
          dimension:
            type: number

      - name: total_order_value
        description: "Total order value calculated as product sales plus freight value."
        meta:
          dimension:
            type: number

      - name: delivery_days
        description: "Number of days from order purchase to actual customer delivery."
        meta:
          dimension:
            type: number

      - name: delivery_delay_days
        description: "Difference in days between actual and estimated customer delivery. Positive values indicate late delivery."
        meta:
          dimension:
            type: number

      - name: is_late
        description: "Indicates whether the order was delivered after the estimated delivery date. 1 means late and 0 means on time."
        meta:
          dimension:
            type: number