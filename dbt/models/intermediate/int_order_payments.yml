version: 2

models:
  - name: int_order_payments
    description: >
      Intermediate model containing order payment records combined
      with relevant order information. It supports payment analysis
      by payment type, installment count, and payment amount.
      Grain: one row per payment record.

    columns:
      - name: order_id
        description: "Unique identifier of the order associated with the payment."

      - name: payment_record_number
        description: "Sequential number identifying a payment record within an order."

      - name: payment_type
        description: "Payment method used by the customer, such as credit card or boleto."

      - name: installment_count
        description: "Number of installments selected for the payment."

      - name: payment_amount
        description: "Amount paid in the individual payment record."

      - name: order_purchase_at
        description: "Timestamp when the customer placed the order associated with the payment."