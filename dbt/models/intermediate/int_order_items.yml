version: 2

models:

  - name: int_order_items

    description: >
      Order-item level model enriched with order, product, and product category
      information. Calculates item revenue from the item price and freight value.
      Grain: one row per combination of order_id and order_item_id.


    columns:

      - name: order_id
        description: "Identifier of the order containing the item."

      - name: order_item_id
        description: "Sequence number identifying the item within an order."

      - name: product_id
        description: "Identifier of the product."

      - name: product_category_name_english
        description: "English product category name."

      - name: price
        description: "Price of the product item, excluding freight."

      - name: freight_value
        description: "Freight value associated with the product item."

      - name: item_revenue
        description: "Product price plus freight value for the order item."

    meta:

      metrics:

        total_revenue:
          type: sum
          sql: ${item_revenue}

        total_items:
          type: count
          sql: ${order_item_id}

        average_item_value:
          type: average
          sql: ${item_revenue}

        total_freight:
          type: sum
          sql: ${freight_value}

        average_freight:
          type: average
          sql: ${freight_value}

        total_orders:
          type: count_distinct
          sql: ${order_id}