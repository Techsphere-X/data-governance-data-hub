x-airflow-common:
  &airflow-common
  image: apache/airflow:3.1.2

  networks:
    - default
    - docker_default
  
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    AIRBYTE_URL: "${AIRBYTE_URL}"
    AIRBYTE_CONNECTION_ID: "${AIRBYTE_CONNECTION_ID}"
    AIRBYTE_CLIENT_ID: "${AIRBYTE_CLIENT_ID}"
    AIRBYTE_CLIENT_SECRET: "${AIRBYTE_CLIENT_SECRET}"
    SUPPLIER_AIRBYTE_CONNECTION_ID: "${SUPPLIER_AIRBYTE_CONNECTION_ID}"
    
    DB_HOST: "${DB_HOST}"
    DB_PORT: "${DB_PORT}"
    DB_NAME: "${DB_NAME}"
    DB_USER: "${DB_USER}"
    DB_PASSWORD: "${DB_PASSWORD}"

    SUPPLIER_DB_HOST: "${SUPPLIER_DB_HOST}"
    SUPPLIER_DB_PORT: "${SUPPLIER_DB_PORT}"
    SUPPLIER_DB_NAME: "${SUPPLIER_DB_NAME}"
    SUPPLIER_DB_USER: "${SUPPLIER_DB_USER}"
    SUPPLIER_DB_PASSWORD: "${SUPPLIER_DB_PASSWORD}"

    MINIO_ENDPOINT: "http://host.docker.internal:9100"
    MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
    MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
    MINIO_BUCKET: "${MINIO_BUCKET}"  

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    - ../simulation:/opt/airflow/simulation
    - ../data:/opt/airflow/data

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    airflow-postgres:
      condition: service_healthy


services:

  airflow-postgres:
    image: postgres:17
    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    <<: *airflow-common

    container_name: airflow-init

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate

    restart: "no"


  airflow-webserver:
    <<: *airflow-common

    container_name: airflow-webserver

    command: api-server

    ports:
      - "8082:8080"

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler

    command: scheduler

    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor

    restart: unless-stopped


volumes:
  airflow_postgres_data:

networks:
  default:
    name: airflow_default

  docker_default:
    external: true
    name: docker_default